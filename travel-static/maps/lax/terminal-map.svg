<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" role="img" aria-label="Schematic terminal map of LAX showing which airlines use each of the nine terminals plus the Tom Bradley International Terminal and the LAX-it rideshare lot. You enter from the top (Sepulveda Blvd) at Terminal 1; Terminal 5 is closed for reconstruction.">
  <style>
    .bg{fill:#f7f6f3}
    .term{fill:#0a0a0b}
    .termclosed{fill:#e7e4dd;stroke:#cfccc3;stroke-width:1.5;stroke-dasharray:5 4}
    .tnum{fill:#fff;font:700 19px system-ui,Segoe UI,Roboto,sans-serif}
    .tnumclosed{fill:#8a887f;font:700 19px system-ui,sans-serif}
    .air{fill:#fff;font:400 12px system-ui,sans-serif}
    .air2{fill:#c9a86a;font:400 11px system-ui,sans-serif}
    .closedtxt{fill:#8a887f;font:700 12px system-ui,sans-serif}
    .closedsub{fill:#9b988f;font:400 10.5px system-ui,sans-serif}
    .title{fill:#0a0a0b;font:700 25px Georgia,'Times New Roman',serif}
    .sub{fill:#6b6a66;font:400 13px system-ui,sans-serif}
    .road{fill:none;stroke:#e6e2da;stroke-width:16;stroke-linejoin:round}
    .roadtxt{fill:#b4b1a8;font:600 10px system-ui,sans-serif;letter-spacing:1px}
    .park{fill:#ece9e2;stroke:#cfccc3;stroke-width:1.5}
    .parktxt{fill:#57564f;font:600 14px system-ui,sans-serif;text-anchor:middle}
    .parksub{fill:#8a887f;font:400 12px system-ui,sans-serif;text-anchor:middle}
    .tbittxt{fill:#fff;font:700 20px system-ui,sans-serif}
    .tbitsub{fill:#c9a86a;font:600 11px system-ui,sans-serif}
    .tbitair{fill:#efeae2;font:400 11px system-ui,sans-serif}
    .laxit{fill:#c9a86a}
    .laxittxt{fill:#0a0a0b;font:700 16px system-ui,sans-serif;text-anchor:middle}
    .laxitsub{fill:#0a0a0b;font:600 11px system-ui,sans-serif;text-anchor:middle;opacity:.78}
    .note{fill:#9b988f;font:400 11px system-ui,sans-serif}
    .arrow{fill:#0a0a0b}
    .arrowtxt{fill:#57564f;font:600 11px system-ui,sans-serif;text-anchor:end}
    .compass{fill:#9b988f;font:600 11px system-ui,sans-serif;text-anchor:middle}
  </style>

  <rect class="bg" x="0" y="0" width="1040" height="800"/>

  <!-- Heading -->
  <text class="title" x="40" y="50">LAX — which airline is in each terminal</text>
  <text class="sub" x="40" y="76">You enter from the top at Terminal 1. The horseshoe runs T1–T3 across the top, T4–T8 along the bottom. Terminal 5 is closed.</text>

  <!-- Compass -->
  <text class="compass" x="1008" y="52">N</text>
  <line x1="1008" y1="84" x2="1008" y2="56" stroke="#9b988f" stroke-width="2"/>
  <polygon class="arrow" points="1008,52 1004,62 1012,62"/>

  <!-- Entrance (from the top — Sepulveda Blvd / I-405), pointing down toward T1 -->
  <line x1="660" y1="96" x2="660" y2="124" stroke="#0a0a0b" stroke-width="3"/>
  <polygon class="arrow" points="660,124 653,112 667,112"/>
  <text class="arrowtxt" x="648" y="104">Entrance —</text>
  <text class="arrowtxt" x="648" y="120">Sepulveda Blvd / I-405</text>

  <!-- World Way loop road (open at the TOP for the entrance) -->
  <path class="road" d="M200 256 V520 a22 22 0 0 0 22 22 H868 a22 22 0 0 0 22 -22 V256"/>
  <text class="roadtxt" x="430" y="566">WORLD WAY — UPPER (DEPARTURES) &amp; LOWER (ARRIVALS)</text>

  <!-- Central parking -->
  <rect class="park" x="320" y="320" width="380" height="160" rx="10"/>
  <text class="parktxt" x="510" y="396">Central Parking</text>
  <text class="parksub" x="510" y="418">Structures P1 – P7</text>

  <!-- ===== TOP row: T3, T2, T1 (entrance side) + LAX-it ===== -->
  <!-- T3 -->
  <rect class="term" x="210" y="128" width="150" height="124" rx="9"/>
  <text class="tnum" x="226" y="156">T3</text>
  <text class="air" x="226" y="182">Delta</text>
  <text class="air" x="226" y="200">Aeroméxico</text>
  <text class="air" x="226" y="218">Virgin Atlantic</text>

  <!-- T2 -->
  <rect class="term" x="370" y="128" width="150" height="124" rx="9"/>
  <text class="tnum" x="386" y="156">T2</text>
  <text class="air" x="386" y="182">Delta</text>
  <text class="air" x="386" y="200">Spirit</text>
  <text class="air" x="386" y="218">WestJet · Norse</text>

  <!-- T1 -->
  <rect class="term" x="530" y="128" width="150" height="124" rx="9"/>
  <text class="tnum" x="546" y="156">T1</text>
  <text class="air" x="546" y="182">JetBlue</text>
  <text class="air" x="546" y="200">Southwest</text>
  <text class="air2" x="546" y="218">Frontier, Allegiant</text>
  <text class="air2" x="546" y="234">(check-in)</text>

  <!-- LAX-it rideshare lot (east of T1) -->
  <rect class="laxit" x="700" y="128" width="200" height="124" rx="9"/>
  <text class="laxittxt" x="800" y="174">LAX-it</text>
  <text class="laxitsub" x="800" y="196">Rideshare &amp; app pickup</text>
  <text class="laxitsub" x="800" y="212">East of Terminal 1</text>

  <!-- ===== West end: Tom Bradley International Terminal ===== -->
  <rect class="term" x="40" y="270" width="158" height="280" rx="9"/>
  <text class="tbittxt" x="56" y="304">TBIT</text>
  <text class="tbitsub" x="56" y="322">Tom Bradley Intl</text>
  <line x1="56" y1="334" x2="182" y2="334" stroke="#3a3a3d" stroke-width="1"/>
  <text class="tbitsub" x="56" y="354">45+ international:</text>
  <text class="tbitair" x="56" y="374">Air France · KLM</text>
  <text class="tbitair" x="56" y="392">British Airways</text>
  <text class="tbitair" x="56" y="410">Emirates · Qatar</text>
  <text class="tbitair" x="56" y="428">Qantas · Japan Air</text>
  <text class="tbitair" x="56" y="446">Korean · Singapore</text>
  <text class="tbitair" x="56" y="464">Lufthansa · ANA</text>
  <text class="tbitair" x="56" y="482">Cathay · Turkish</text>
  <text class="tbitair" x="56" y="506" fill="#c9a86a">…and many more</text>

  <!-- ===== BOTTOM row: T4, T5(closed), T6, T7, T8 ===== -->
  <!-- T4 -->
  <rect class="term" x="210" y="566" width="150" height="124" rx="9"/>
  <text class="tnum" x="226" y="594">T4</text>
  <text class="air" x="226" y="620">American</text>
  <text class="air" x="226" y="638">American Eagle</text>

  <!-- T5 closed -->
  <rect class="termclosed" x="370" y="566" width="150" height="124" rx="9"/>
  <text class="tnumclosed" x="386" y="594">T5</text>
  <text class="closedtxt" x="386" y="622">CLOSED</text>
  <text class="closedsub" x="386" y="640">Under</text>
  <text class="closedsub" x="386" y="655">reconstruction</text>

  <!-- T6 -->
  <rect class="term" x="530" y="566" width="150" height="124" rx="9"/>
  <text class="tnum" x="546" y="594">T6</text>
  <text class="air" x="546" y="620">Alaska</text>
  <text class="air" x="546" y="638">Hawaiian</text>
  <text class="air" x="546" y="656">Air Canada</text>

  <!-- T7 -->
  <rect class="term" x="690" y="566" width="150" height="124" rx="9"/>
  <text class="tnum" x="706" y="594">T7</text>
  <text class="air" x="706" y="620">United</text>

  <!-- T8 -->
  <rect class="term" x="850" y="566" width="150" height="124" rx="9"/>
  <text class="tnum" x="866" y="594">T8</text>
  <text class="air" x="866" y="620">United</text>

  <!-- Note -->
  <text class="note" x="40" y="770">Original schematic for orientation — not to scale. Terminal assignments change; always confirm on your airline’s boarding pass or flylax.com.</text>
</svg>
