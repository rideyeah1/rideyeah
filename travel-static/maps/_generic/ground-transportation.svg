<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Ground transportation illustration: an airport shuttle bus">
  <rect width="400" height="220" fill="#efeae2"/>
  <g fill="none" stroke="#0a0a0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- shuttle body -->
    <rect x="70" y="70" width="240" height="80" rx="10" fill="#0a0a0b"/>
    <!-- windows -->
    <rect x="86" y="84" width="40" height="30" rx="4" fill="#efeae2" stroke="none"/>
    <rect x="134" y="84" width="40" height="30" rx="4" fill="#efeae2" stroke="none"/>
    <rect x="182" y="84" width="40" height="30" rx="4" fill="#efeae2" stroke="none"/>
    <rect x="230" y="84" width="64" height="30" rx="4" fill="#c9a86a" stroke="none"/>
    <!-- wheels -->
    <circle cx="120" cy="150" r="16" fill="#efeae2"/>
    <circle cx="120" cy="150" r="6" fill="#0a0a0b" stroke="none"/>
    <circle cx="262" cy="150" r="16" fill="#efeae2"/>
    <circle cx="262" cy="150" r="6" fill="#0a0a0b" stroke="none"/>
    <!-- ground -->
    <line x1="30" y1="166" x2="370" y2="166" stroke="#cfccc3"/>
  </g>
  <text x="262" y="104" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0a0a0b" text-anchor="middle">SHUTTLE</text>
</svg>
