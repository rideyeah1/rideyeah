<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · RideYeah</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0B;--bone:#F7F6F3;--mute:#A9A7A0;--gold:#C9A86A;--line:rgba(247,246,243,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--bone);font-family:'Manrope',system-ui,sans-serif;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;overflow:hidden;position:relative}
body::before{content:'';position:absolute;left:50%;top:-20%;width:70%;height:80%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(201,168,106,.14),transparent 70%);pointer-events:none}
.box{position:relative;max-width:520px}
.code{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:clamp(88px,22vw,180px);line-height:1;letter-spacing:-.03em;color:var(--gold);font-style:italic}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500;margin:18px 0 14px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:clamp(26px,5vw,38px);letter-spacing:-.02em;margin-bottom:16px}
p{color:var(--mute);font-size:16px;max-width:380px;margin:0 auto 34px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--ink);padding:14px 30px;border-radius:2px;font-size:13px;letter-spacing:.08em;font-weight:600;transition:transform .25s,background .25s;text-decoration:none}
.btn:hover{background:#D9C193;transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="eyebrow">RideYeah</div>
    <h1>This road doesn't exist.</h1>
    <p>The page you're looking for has moved or never was. Let's get you back on route.</p>
    <a href="/" class="btn">Return home
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>
  </div>
</body>
</html>
